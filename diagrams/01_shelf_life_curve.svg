<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 600; fill: #111827; }
      .subtitle { font-size: 13px; fill: #6B7280; }
      .axis-label { font-size: 12px; fill: #374151; font-weight: 500; }
      .tick-label { font-size: 11px; fill: #6B7280; }
      .line-label { font-size: 12px; font-weight: 600; }
      .callout { font-size: 11px; fill: #4B5563; font-style: italic; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="900" height="520" fill="#FFFFFF"/>

  <!-- Title + subtitle -->
  <text x="60" y="34" class="title">Governance validity decays — at different rates</text>
  <text x="60" y="54" class="subtitle">Three approaches to AI governance, trajectory over 36 months since last major update</text>

  <!-- Horizontal gridlines (at 0, 25, 50, 75, 100%) -->
  <g stroke="#F3F4F6" stroke-width="1">
    <line x1="80" y1="90"  x2="700" y2="90"/>
    <line x1="80" y1="180" x2="700" y2="180"/>
    <line x1="80" y1="270" x2="700" y2="270"/>
    <line x1="80" y1="360" x2="700" y2="360"/>
  </g>
  <!-- 0% gridline (darker - baseline) -->
  <line x1="80" y1="450" x2="700" y2="450" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Axes -->
  <line x1="80" y1="450" x2="700" y2="450" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="90"  x2="80"  y2="450" stroke="#374151" stroke-width="1.5"/>

  <!-- Y-axis tick labels -->
  <g class="tick-label" text-anchor="end">
    <text x="72" y="94">100%</text>
    <text x="72" y="184">75%</text>
    <text x="72" y="274">50%</text>
    <text x="72" y="364">25%</text>
    <text x="72" y="454">0%</text>
  </g>

  <!-- Y-axis title (rotated) -->
  <text x="28" y="270" class="axis-label" text-anchor="middle" transform="rotate(-90 28 270)">Governance validity</text>

  <!-- X-axis tick labels -->
  <g class="tick-label" text-anchor="middle">
    <text x="80"  y="472">0</text>
    <text x="183" y="472">6</text>
    <text x="287" y="472">12</text>
    <text x="390" y="472">18</text>
    <text x="493" y="472">24</text>
    <text x="597" y="472">30</text>
    <text x="700" y="472">36</text>
  </g>

  <!-- X-axis title -->
  <text x="390" y="498" class="axis-label" text-anchor="middle">Months since last major governance update</text>

  <!-- ========= Line 1: Snapshot compliance (red dashed) =========
       Pixel mapping: X = 80 + m * 17.222, Y = 450 - p * 3.6
       Points (month, %): (0,100)(3,82)(6,68)(9,58)(12,48)(18,32)(24,20)(30,12)(36,7)
  -->
  <path d="M 80 90 L 132 155 L 183 206 L 235 242 L 287 277 L 390 335 L 493 378 L 597 407 L 700 425"
        stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="7,4" fill="none"/>

  <!-- Marker dots on line 1 (at month 0, 12, 24, 36) -->
  <g fill="#B91C1C">
    <circle cx="80"  cy="90"  r="3.5"/>
    <circle cx="287" cy="277" r="3.5"/>
    <circle cx="493" cy="378" r="3.5"/>
    <circle cx="700" cy="425" r="3.5"/>
  </g>

  <!-- ========= Line 2: Event-triggered reviews (blue, sawtooth dips recovering) =========
       Pattern: drops to 65% every 6mo, recovers to 90% via review
       Points (month, %): (0,95) (6,68) (6,90-after-review) (12,64) (12,89) (18,62) (18,87)
                          (24,60) (24,85) (30,58) (30,82) (36,57)
  -->
  <path d="M 80 108 L 183 205 L 183 126 L 287 221 L 287 130 L 390 227 L 390 137 L 493 234 L 493 144 L 597 241 L 597 155 L 700 245"
        stroke="#1E40AF" stroke-width="2.5" fill="none"/>

  <!-- Marker dots on line 2 -->
  <g fill="#1E40AF">
    <circle cx="80"  cy="108" r="3.5"/>
    <circle cx="183" cy="126" r="3.5"/>
    <circle cx="287" cy="130" r="3.5"/>
    <circle cx="390" cy="137" r="3.5"/>
    <circle cx="493" cy="144" r="3.5"/>
    <circle cx="597" cy="155" r="3.5"/>
    <circle cx="700" cy="245" r="3.5"/>
  </g>

  <!-- ========= Line 3: Shelf-life engineered (green, stays high with small dips) =========
       Pattern: catches triggers early, small dips, quick recovery
       Points (month, %): (0,96) (3,88) (3,94) (8,84) (8,93) (14,82) (14,94)
                          (22,83) (22,95) (30,85) (30,96) (36,87)
  -->
  <path d="M 80 104 L 132 133 L 132 112 L 218 148 L 218 119 L 321 155 L 321 112 L 459 151 L 459 108 L 597 144 L 597 104 L 700 137"
        stroke="#065F46" stroke-width="3" fill="none"/>

  <!-- Marker dots on line 3 -->
  <g fill="#065F46">
    <circle cx="80"  cy="104" r="4"/>
    <circle cx="132" cy="112" r="4"/>
    <circle cx="218" cy="119" r="4"/>
    <circle cx="321" cy="112" r="4"/>
    <circle cx="459" cy="108" r="4"/>
    <circle cx="597" cy="104" r="4"/>
    <circle cx="700" cy="137" r="4"/>
  </g>

  <!-- ========= Line labels on the right side ========= -->
  <!-- Line 3 label (green, topmost at end) -->
  <text x="708" y="132" class="line-label" fill="#065F46">Shelf-life</text>
  <text x="708" y="146" class="line-label" fill="#065F46">engineered</text>
  <text x="708" y="160" class="callout" fill="#065F46">(Chris's approach)</text>

  <!-- Line 2 label (blue) -->
  <text x="708" y="249" class="line-label" fill="#1E40AF">Event-triggered</text>
  <text x="708" y="263" class="line-label" fill="#1E40AF">reviews</text>

  <!-- Line 1 label (red) -->
  <text x="708" y="428" class="line-label" fill="#B91C1C">Snapshot compliance</text>
  <text x="708" y="442" class="callout" fill="#B91C1C">(typical vendor default)</text>

  <!-- ========= Callouts / annotations ========= -->

  <!-- Annotation: "model update" trigger at month 6 -->
  <line x1="183" y1="90" x2="183" y2="450" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="183" y="82" class="callout" text-anchor="middle">Model update</text>

  <!-- Annotation: "reg change" trigger at month 18 -->
  <line x1="390" y1="90" x2="390" y2="450" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="390" y="82" class="callout" text-anchor="middle">Regulation shift</text>

  <!-- Annotation: "vendor posture change" at month 30 -->
  <line x1="597" y1="90" x2="597" y2="450" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="597" y="82" class="callout" text-anchor="middle">Vendor posture change</text>
</svg>
